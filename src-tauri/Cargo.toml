[package]
name = "velox"
version = "1.0.1"
description = "Velox: a universal multi-source media player and streaming client"
authors = ["Velox contributors"]
repository = "https://github.com/sipbuu/Velox"
edition = "2021"
rust-version = "1.80"

[lib]
name = "velox_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-os = "2"
tauri-plugin-store = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
log = "0.4"

tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "sync", "time", "net"] }
tokio-util = "0.7"
futures-util = "0.3"
bytes = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "gzip", "brotli", "deflate", "http2", "charset"] }
axum = { version = "0.8", default-features = false, features = ["tokio", "http1", "query"] }
tower-http = { version = "0.6", features = ["cors"] }

url = "2"
base64 = "0.23"
uuid = { version = "1", features = ["v4"] }
walkdir = "2"
quick-xml = "0.37"
flate2 = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }

[target.'cfg(not(target_os = "ios"))'.dependencies]
tauri-plugin-log = "2"

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[profile.dev.package."*"]
opt-level = 2
