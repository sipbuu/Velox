[package]
name = "tauri-plugin-native-glass"
version = "0.1.0"
description = "Native Liquid Glass chrome (UITabBar) for Velox on iOS"
edition = "2021"
rust-version = "1.80"
links = "tauri-plugin-native-glass"

[dependencies]
tauri = "2"
serde = { version = "1", features = ["derive"] }

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
